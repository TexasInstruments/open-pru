[package]
name = "audio_pipe"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "8-mic front-end (WPE, DOA, mask-MVDR) with per-talker whisper ASR, PC consumer of pdm_audio_eth"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
hound = "3.5.1"
num-complex = "0.4.6"
rayon = "1.12.0"
realfft = "3.5.1"
serde_json = "1.0.154"
whisper-rs = { version = "0.16.0", features = ["cuda"] }

[dev-dependencies]
tempfile = "3.27.0"
