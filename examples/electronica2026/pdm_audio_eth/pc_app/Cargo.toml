[package]
name = "pdm_eth"
version = "0.1.0"
edition = "2024"
description = "PC side of the electronica 2026 pdm_audio_eth demo: Ethernet test, audio stream in and out, live spectrograms"
license = "BSD-3-Clause"

[lib]
name = "pdm_eth"
path = "src/lib.rs"

[[bin]]
name = "pdm-eth"
path = "src/main.rs"

[dependencies]
rfd = "0.17"
clap = { version = "4.6.7", features = ["derive"] }
eframe = "0.37"
hound = "3.5.1"
libc = "0.2"
png = "0.18.1"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
